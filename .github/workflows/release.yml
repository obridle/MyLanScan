name: Release

# Push a version tag (e.g. v0.3.0) to build both platforms and publish a
# GitHub Release. workflow_dispatch runs the test + build jobs without
# publishing (handy for validating the pipeline).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (logic)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' Sample/S1mvp.py | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Sample/S1mvp.py says APP_VERSION=$version but tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install customtkinter zeroconf scapy

      - name: Run headless tests (live network checks skipped)
        env:
          MYLANSCAN_SKIP_LIVE: "1"
        run: python3 Sample/S1mvp_test.py

  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Python with Tk (Homebrew Python ships without it)
        run: brew install python@3.12 python-tk@3.12

      - name: Install create-dmg (optional, for a styled DMG)
        run: brew install create-dmg || true

      - name: Verify tkinter
        run: /opt/homebrew/bin/python3.12 -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Create build interpreter
        run: /opt/homebrew/bin/python3.12 -m venv venv

      - name: Build DMG
        run: ./build_package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: MyLanScan-macos-arm64.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (x86_64 + aarch64 via Docker/QEMU)
        run: ./build_package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist-linux/MyLanScan-linux-x86_64
            dist-linux/MyLanScan-linux-aarch64
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [test, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
